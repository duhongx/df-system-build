<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer ring - rotating -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#409eff" stroke-width="2" stroke-dasharray="8 4" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner ring - counter rotating -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#409eff" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.25">
    <animateTransform attributeName="transform" type="rotate" from="360 32 32" to="0 32 32" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Center hexagon / shield shape -->
  <path d="M32 10 L50 20 L50 40 L32 52 L14 40 L14 20 Z" fill="#409eff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- D letter -->
  <path d="M24 22 L24 42 L34 42 C40 42 44 38 44 32 C44 26 40 22 34 22 Z M28 26 L33 26 C37.5 26 40 28.5 40 32 C40 35.5 37.5 38 33 38 L28 38 Z" fill="#fff"/>

  <!-- F letter - small -->
  <path d="M30 28 L38 28 L38 30.5 L32.5 30.5 L32.5 33 L36.5 33 L36.5 35.5 L32.5 35.5 L32.5 40 L30 40 Z" fill="#fff" opacity="0"/>

  <!-- Orbiting dot 1 -->
  <circle cx="32" cy="4" r="3" fill="#67c23a">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting dot 2 -->
  <circle cx="32" cy="4" r="2.5" fill="#e6a23c">
    <animateTransform attributeName="transform" type="rotate" from="120 32 32" to="480 32 32" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting dot 3 -->
  <circle cx="32" cy="4" r="2" fill="#f56c6c">
    <animateTransform attributeName="transform" type="rotate" from="240 32 32" to="600 32 32" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2.5;1.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#409eff" stroke-width="1" opacity="0">
    <animate attributeName="r" values="16;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
